<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Romford · Simple booking view</title>
<meta name="claude:viewport-fit-sides" content="cover">
<style>
/* Layout: white app, brand-coloured header strip; Bookings and Suppliers use list (left) + detail (right); a save bar appears at the bottom when there are unsaved changes.
   Single light theme by choice. --brand is a placeholder until the Romford logo colour is confirmed. */
:root{
  color-scheme:light;
  --brand:#17365D; --brand-ink:#FFFFFF; --brand-soft:#E9EFF7; --brand-line:#C9D6E8;
  --bg:#FFFFFF; --sunk:#F4F6F9; --ink:#14202E; --muted:#5B6878; --line:#E1E6ED;
  --ok:#1D7A3D; --ok-soft:#E3F3E7; --warn:#8C5900; --warn-soft:#FBF0D9; --bad:#B42318; --bad-soft:#FDECEA;
  /* confidential = violet; money owed to suppliers = orange */
  --conf:#6B3FA0; --conf-soft:#F5F0FB; --conf-line:#DCCDEF; --owed:#B54708; --owed-soft:#FEF0E6;
  /* service colours */
  --svc-tour:#0F766E; --svc-flight:#0369A1; --svc-hotel:#BE185D; --svc-visa:#A16207; --svc-other:#475569;
  --shadow:0 1px 2px rgba(20,32,46,.05),0 6px 18px rgba(20,32,46,.06);
  --display:"Bricolage Grotesque",ui-sans-serif,system-ui,sans-serif;
  --body:"Figtree",ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --mono:"JetBrains Mono",ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:14px;line-height:1.45}
.strip{height:5px;background:var(--brand)}
.wrap{max-width:1240px;margin:0 auto;padding-block:18px 110px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:flex;flex-direction:column;gap:16px}
button,input,select{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--brand);outline-offset:2px}
.stat b,.pl b,.kv b,.totline b,td.num{font-variant-numeric:tabular-nums}
.mono,.fid{font-family:var(--mono);font-size:12px;letter-spacing:.02em}
.muted{color:var(--muted)}
small{font-size:12px}

.top{display:flex;flex-wrap:wrap;gap:14px 24px;align-items:flex-end;justify-content:space-between}
.word{font-size:11px;font-weight:700;letter-spacing:.18em;text-transform:uppercase;color:var(--brand)}
.brand h1{font-family:var(--display);font-size:26px;line-height:1.1;margin:2px 0 0;letter-spacing:-.01em;color:var(--brand);text-wrap:balance}
.brand p{margin:4px 0 0;color:var(--muted)}
.tag{display:inline-block;font-family:var(--body);font-size:11px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--warn);background:var(--warn-soft);padding:2px 8px;border-radius:999px;margin-left:8px;vertical-align:middle}
.roles{display:flex;flex-wrap:wrap;gap:4px;background:var(--sunk);border:1px solid var(--line);padding:4px;border-radius:12px}
.role{border:0;background:transparent;padding:7px 12px;border-radius:9px;cursor:pointer;text-align:left;color:var(--muted)}
.role b{display:block;font-weight:600;font-size:14px}
.role[aria-pressed="true"]{background:var(--brand);color:var(--brand-ink)}

.tabs{display:flex;flex-wrap:wrap;gap:2px;border-bottom:1px solid var(--line)}
.tab{border:0;background:none;padding:10px 14px;border-bottom:3px solid transparent;margin-bottom:-1px;cursor:pointer;color:var(--muted);font-weight:600;display:flex;gap:6px;align-items:center}
.tab[aria-selected="true"]{color:var(--brand);border-color:var(--brand)}
.badge{background:var(--bad);color:#FFFFFF;font-size:11px;border-radius:999px;padding:1px 7px;font-weight:700}
.adminbar{display:flex;flex-wrap:wrap;gap:8px 16px;align-items:center;background:var(--brand-soft);padding:9px 14px;border-radius:10px}

.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}
.stat{background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:10px 14px}
.stat span{display:block;font-size:11px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.stat b{font-family:var(--display);font-size:20px;font-weight:600;color:var(--brand)}

.main{display:grid;grid-template-columns:minmax(0,340px) minmax(0,1fr);gap:20px;align-items:start}
@media (max-width:880px){.main{grid-template-columns:minmax(0,1fr)}}
.listhead{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:8px}
.listhead h2,.group{font-size:12px;font-weight:600;letter-spacing:.07em;text-transform:uppercase;color:var(--muted);margin:0}
.group{margin:8px 0 2px}
.filters{display:flex;gap:6px;margin-bottom:8px;flex-wrap:wrap}
.fbtn{border:1px solid var(--line);background:var(--bg);border-radius:999px;padding:5px 12px;cursor:pointer;font-size:13px;font-weight:600;color:var(--muted)}
.fbtn[aria-pressed="true"]{background:var(--brand);border-color:var(--brand);color:var(--brand-ink)}
.list{display:flex;flex-direction:column;gap:8px}
.item{width:100%;text-align:left;background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:11px 13px;cursor:pointer;display:flex;flex-direction:column;gap:3px}
.item:hover{border-color:var(--brand-line)}
.item[aria-current="true"]{border-color:var(--brand);box-shadow:0 0 0 1px var(--brand);background:var(--brand-soft)}
.item .row1{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap}
.item .nm{font-weight:600;font-size:15px}
.item .ds{color:var(--muted);font-size:13px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.item .fig{display:flex;justify-content:space-between;font-size:13px;margin-top:4px;padding-top:6px;border-top:1px solid var(--line)}
.item .fig span{color:var(--muted)}

.chip{display:inline-flex;align-items:center;padding:2px 9px;border-radius:999px;font-size:12px;font-weight:600;white-space:nowrap}
.chip.ok{background:var(--ok-soft);color:var(--ok)}
.chip.warn{background:var(--warn-soft);color:var(--warn)}
.chip.bad{background:var(--bad-soft);color:var(--bad)}
.chip.accent{background:var(--brand-soft);color:var(--brand)}
.chip.plain{background:var(--sunk);color:var(--muted)}
.chips{display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end}
.btn{border:0;background:var(--brand);color:var(--brand-ink);padding:8px 14px;border-radius:8px;font-weight:600;cursor:pointer;white-space:nowrap}
.btn.ghost{background:var(--bg);color:var(--brand);border:1px solid var(--brand)}
.btn.danger{background:var(--bg);color:var(--bad);border:1px solid var(--bad)}
.btn.small{padding:6px 11px;font-size:13px}
.linkbtn{border:0;background:none;color:var(--brand);text-decoration:underline;cursor:pointer;padding:2px 0;font-size:13px;font-weight:600}
.icon{border:1px solid var(--line);background:var(--bg);border-radius:6px;width:30px;height:30px;cursor:pointer;color:var(--muted);font-size:16px;line-height:1}
.icon:hover{color:var(--bad);border-color:var(--bad)}

.panel{background:var(--bg);border:1px solid var(--line);border-radius:14px;box-shadow:var(--shadow);min-width:0}
.dhead{display:flex;flex-wrap:wrap;gap:10px 16px;justify-content:space-between;align-items:flex-start;padding:18px 20px 12px}
.dhead h2{font-family:var(--display);font-size:24px;margin:2px 0;line-height:1.15;text-wrap:balance}
.dhead p{margin:0}
.steps{display:flex;gap:6px;padding:0 20px 16px;flex-wrap:wrap}
.step{flex:1 1 110px;border-top:3px solid var(--line);padding-top:6px;font-size:12px;color:var(--muted);font-weight:500}
.step.done{border-color:var(--brand);color:var(--ink)}
.step.now{border-color:var(--warn);color:var(--ink)}
.sec{border-top:1px solid var(--line);padding:16px 20px;display:flex;flex-direction:column;gap:12px}
.sec:first-child{border-top:0}
.sec h3{margin:0;font-size:12px;font-weight:700;letter-spacing:.07em;text-transform:uppercase;color:var(--brand)}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px}
.fld{display:flex;flex-direction:column;gap:4px;min-width:0}
.fld.wide{grid-column:1/-1}
.fld>span,.lbl{font-size:12px;color:var(--muted);font-weight:500}
.fld input,.fld select,td input,td select,.addrow input,.addrow select,.payrow input{width:100%;background:var(--bg);border:1px solid #CBD3DE;border-radius:7px;padding:8px 10px;min-width:0;min-height:38px}
.fld input:focus,.fld select:focus,td input:focus,td select:focus,.addrow input:focus{border-color:var(--brand);outline:2px solid var(--brand-soft);outline-offset:0}
.fld input:disabled{opacity:.55;background:var(--sunk)}
.fld.miss input,.fld.miss select{border-color:var(--bad);background:var(--bad-soft)}
.fld.miss>span{color:var(--bad)}
.fld output{display:block;padding:8px 0;font-weight:500;overflow-wrap:anywhere}
.kv{display:flex;flex-direction:column;gap:4px;justify-content:flex-end}
.kv span{font-size:12px;color:var(--muted);font-weight:500}
.kv b{font-size:16px;padding:5px 0}
.warnt{color:var(--warn)}
.tbl{overflow-x:auto;border:1px solid var(--line);border-radius:9px;background:var(--bg)}
table{border-collapse:collapse;width:100%}
th,td{text-align:left;padding:8px 10px;border-bottom:1px solid var(--line);vertical-align:top}
th{font-size:11px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);background:var(--sunk);white-space:nowrap}
tbody tr:last-child td{border-bottom:0}
td.num,th.num{text-align:right}
td input.num{text-align:right}
table.lines{min-width:680px}
table.rec{min-width:620px}
table.sch{min-width:720px}
table.pay{min-width:680px}
table.log{min-width:720px}
table.bk{min-width:420px}
td.emptyrow{color:var(--muted);text-align:center;padding:14px}
tr.chg td{background:var(--warn-soft)}
.addrow{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:8px;align-items:center;background:var(--sunk);padding:10px;border-radius:9px}
.tick{display:inline-flex;gap:8px;align-items:center;cursor:pointer;font-weight:500}
.tick input{width:16px;height:16px;accent-color:var(--brand);flex:none}
.knows{background:var(--brand-soft);padding:10px 12px;border-radius:9px;font-weight:600}
.row{display:flex;flex-wrap:wrap;gap:10px 18px;align-items:center}
.seg{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:8px}
.seg button,.svc{border:1px solid var(--line);background:var(--bg);border-radius:10px;padding:10px 12px;text-align:left;cursor:pointer}
.seg button b,.svc b{display:block;font-weight:600}
.seg button small,.svc small{color:var(--muted)}
.seg button[aria-pressed="true"]{border-color:var(--brand);background:var(--brand-soft);box-shadow:0 0 0 1px var(--brand)}
.seg button:disabled{cursor:default}
.svcgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}
.svc{padding:16px}
.svc b{font-family:var(--display);font-size:18px;color:var(--brand)}
.svc:hover{border-color:var(--brand)}
.pc{display:flex;flex-direction:column;gap:4px;align-items:flex-start}
.pc small{color:var(--muted)}
.payrow{display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.payrow input{width:170px}
.payto{display:flex;flex-direction:column;font-size:13px;line-height:1.4}
.payto b{font-weight:600}
.payto small{color:var(--muted);margin-bottom:2px}
.totline{display:flex;justify-content:flex-end;gap:14px;align-items:baseline;font-size:15px}
.totline span{color:var(--muted)}
.totline b{font-size:18px;font-family:var(--display)}
.pl{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:10px}
.pl>div{background:var(--sunk);border:1px solid var(--line);border-radius:9px;padding:10px 12px;display:flex;flex-direction:column}
.pl span{font-size:12px;color:var(--muted);font-weight:500}
.pl b{font-family:var(--display);font-size:19px;font-weight:600}
.pl small{color:var(--muted)}
.pl .m{background:#FFFFFF;border-color:var(--conf)}
.pl .m b{color:var(--conf)}
.pl.sub b{font-size:16px;font-family:var(--body)}
.note{margin:0;padding:10px 12px;border-radius:8px;font-size:13px}
.note.warn{background:var(--warn-soft);color:var(--warn)}
.note.bad{background:var(--bad-soft);color:var(--bad)}
.note.info{background:var(--brand-soft);color:var(--ink)}
.draft{display:flex;flex-wrap:wrap;gap:10px 16px;align-items:center;justify-content:space-between;background:var(--brand-soft);border:1px solid var(--brand-line);border-radius:10px;padding:12px 14px;margin:0 20px 14px}
.draft p{margin:0;max-width:60ch}
.draft ul{margin:6px 0 0;padding-left:18px;color:var(--bad)}
.checks{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:4px;font-size:13px}
.missbox{background:#FFFBF5}
.mlist{list-style:none;margin:0;padding:0;display:flex;flex-direction:column}
.mlist li{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;padding:7px 0;border-bottom:1px dashed var(--line)}
.mlist li:last-child{border-bottom:0}
.allok{padding:0 20px 14px}
.pending{border:1px solid var(--warn);background:var(--warn-soft);border-radius:10px;padding:12px;display:flex;flex-direction:column;gap:10px}
.pending p{margin:0}
.hist{list-style:none;margin:0;padding:0;display:flex;flex-direction:column}
.hist li{display:grid;grid-template-columns:minmax(0,150px) minmax(0,1fr);gap:4px 12px;padding:7px 0;border-bottom:1px solid var(--line);font-size:13px}
.hist li:last-child{border-bottom:0}
.hist .when{color:var(--muted)}
@media (max-width:520px){.hist li{grid-template-columns:minmax(0,1fr)}}
.chgv{font-variant-numeric:tabular-nums}
.chgv s{color:var(--muted)}
.empty{padding:40px 20px;text-align:center;color:var(--muted)}
.paysec{display:flex;flex-direction:column;gap:8px}
.paysec h2{font-family:var(--display);font-size:18px;margin:6px 0 0;color:var(--brand)}
.paysec p{margin:0;color:var(--muted)}
.foot{color:var(--muted);font-size:13px;display:flex;flex-wrap:wrap;gap:8px 18px;justify-content:space-between;align-items:center;border-top:1px solid var(--line);padding-top:14px}
.foot p{margin:0;max-width:70ch}

#savebar{position:fixed;left:0;right:0;bottom:0;z-index:20;background:var(--bg);border-top:2px solid var(--brand);box-shadow:0 -6px 18px rgba(20,32,46,.08);padding-block:12px calc(12px + env(safe-area-inset-bottom,0px));padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
#savebar .in{max-width:1240px;margin:0 auto;display:flex;gap:10px 14px;align-items:center;justify-content:flex-end;flex-wrap:wrap}
#savebar .msg{margin-right:auto;font-weight:600}
#savebar.flash .msg{color:var(--bad)}
#toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(84px + env(safe-area-inset-bottom,0px));z-index:30;background:var(--ink);color:#FFFFFF;padding:10px 16px;border-radius:9px;font-weight:600;max-width:min(92vw,520px);text-align:center}
/* list view */
.listbar{display:flex;flex-wrap:wrap;gap:10px 14px;align-items:center;justify-content:space-between}
.listbar h2{font-family:var(--display);font-size:20px;margin:0;color:var(--brand)}
.listtools{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.search{border:1px solid #CBD3DE;border-radius:8px;padding:8px 12px;min-height:38px;width:240px;max-width:100%;background:var(--bg)}
.search:focus{border-color:var(--brand);outline:2px solid var(--brand-soft);outline-offset:0}
table.blist{min-width:640px}
table.blist td{vertical-align:middle;padding:11px 12px}
table.blist .fid,.nw{white-space:nowrap}
table.blist th{padding:10px 12px}
tr.rowlink{cursor:pointer}
tr.rowlink:hover td{background:var(--brand-soft)}
tr.rowlink:focus-visible{outline:2px solid var(--brand);outline-offset:-2px}
.cname{font-weight:600}
.sub{display:block;color:var(--muted);font-size:12px}
.backrow{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
.backbtn{border:1px solid var(--line);background:var(--bg);border-radius:8px;padding:7px 12px;cursor:pointer;font-weight:600;color:var(--brand)}
.backbtn:hover{border-color:var(--brand)}
.detailwrap{display:flex;flex-direction:column;gap:12px;max-width:1040px;width:100%;margin:0 auto}
/* colour system */
.sec.conf{background:var(--conf-soft);box-shadow:inset 4px 0 0 var(--conf)}
.sec.conf h3{color:var(--conf)}
.conftag{display:inline-flex;align-items:center;gap:4px;margin-left:8px;padding:1px 8px;border-radius:999px;background:var(--conf);color:#FFFFFF;font-size:10px;letter-spacing:.06em;vertical-align:middle}
th.conf{background:var(--conf-soft);color:var(--conf)}
td.conf{background:var(--conf-soft)}
tr.rowlink:hover td.conf{background:#EADFF7}
.stat.conf{background:var(--conf-soft);border-color:var(--conf-line)}
.stat.conf span,.stat.conf b{color:var(--conf)}
.owed{color:var(--owed)}
.okt{color:var(--ok)}
.chip.owed{background:var(--owed-soft);color:var(--owed)}
.dot{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:6px;vertical-align:1px;background:var(--svc-other)}
.dot.tour{background:var(--svc-tour)}.dot.flight{background:var(--svc-flight)}.dot.hotel{background:var(--svc-hotel)}.dot.visa{background:var(--svc-visa)}.dot.other{background:var(--svc-other)}
.legend{border:1px solid var(--line);border-radius:10px;background:var(--sunk);font-size:13px}
.legend summary{cursor:pointer;padding:9px 14px;font-weight:600;color:var(--brand)}
.lg{display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:12px 22px;padding:4px 14px 14px}
.lg h4{margin:0 0 6px;font-size:11px;letter-spacing:.07em;text-transform:uppercase;color:var(--muted)}
.lg ul{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:5px}
.sw{display:inline-block;width:14px;height:14px;border-radius:4px;vertical-align:-2px;margin-right:6px;border:1px solid var(--conf-line);background:var(--conf-soft)}
.exp{display:flex;gap:6px;flex-wrap:wrap}
.exp .btn:disabled{opacity:.5;cursor:not-allowed}
.confbanner{display:flex;flex-wrap:wrap;gap:8px 16px;align-items:center;justify-content:space-between;background:var(--conf);color:#FFFFFF;border-radius:10px;padding:10px 16px}
.confbanner b{font-family:var(--display);font-size:18px}
.confbanner span{opacity:.9;font-size:13px}
.bars{display:flex;flex-direction:column;gap:8px}
.bar{display:grid;grid-template-columns:minmax(0,130px) minmax(0,1fr) minmax(0,150px);gap:10px;align-items:center;font-size:13px}
.bar .tr{background:var(--sunk);border-radius:5px;height:14px;overflow:hidden}
.bar .fl{height:100%;border-radius:5px;background:var(--conf)}
.bar .vl{text-align:right;font-variant-numeric:tabular-nums}
.cards2{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:14px}
.card{border:1px solid var(--line);border-radius:12px;padding:14px 16px;display:flex;flex-direction:column;gap:10px;background:var(--bg)}
.card h3{margin:0;font-size:12px;font-weight:700;letter-spacing:.07em;text-transform:uppercase;color:var(--conf)}
table.profit{min-width:720px}
table.profit td{vertical-align:middle}
table.profit .fid{white-space:nowrap}
[hidden]{display:none!important}
.selsm{border:1px solid #CBD3DE;border-radius:8px;padding:7px 10px;min-height:38px;background:var(--bg)}
/* accordions: simple view first, "More" for detail */
details.sec.acc{display:block;padding:0}
details.acc>summary,details.pgsec>summary{list-style:none;cursor:pointer;display:flex;flex-wrap:wrap;align-items:center;gap:4px 14px;padding:14px 20px}
details.acc>summary::-webkit-details-marker,details.pgsec>summary::-webkit-details-marker,.bankd>summary::-webkit-details-marker{display:none}
details.acc>summary:hover,details.pgsec>summary:hover{background:rgba(23,54,93,.03)}
.at{font-size:12px;font-weight:700;letter-spacing:.07em;text-transform:uppercase;color:var(--brand)}
details.acc.conf .at{color:var(--conf)}
.as{color:var(--muted);font-size:13px;flex:1 1 220px;min-width:0}
.as b{font-weight:600}
.more{margin-left:auto;font-size:12px;font-weight:600;color:var(--brand);white-space:nowrap}
.more::after{content:"More ▾"}
details[open]>summary .more::after{content:"Less ▴"}
.ab{padding:0 20px 18px;display:flex;flex-direction:column;gap:12px}
details.pgsec{border:1px solid var(--line);border-radius:12px;background:var(--bg)}
details.pgsec>summary{padding:12px 16px}
.ptitle{font-family:var(--display);font-size:17px;font-weight:600;color:var(--brand)}

.facts{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:8px;padding:0 20px 14px}
.facts div{background:var(--sunk);border-radius:9px;padding:8px 12px;display:flex;flex-direction:column}
.facts div>span{font-size:11px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.facts b{font-size:15px;font-variant-numeric:tabular-nums}
.morebtn{border:1px dashed var(--brand-line);background:var(--bg);color:var(--brand);font-weight:600;cursor:pointer;text-align:center;display:flex;align-items:center;justify-content:center}
.morebtn:hover{border-color:var(--brand)}
.bankd>summary{list-style:none;cursor:pointer;font-size:12px;font-weight:600;color:var(--brand);margin-top:4px}
.bankd[open]>summary{margin-bottom:4px}
table.cash{min-width:760px}
table.cash td{vertical-align:middle}
.amt-in{color:var(--ok);font-weight:600}
.amt-out{color:var(--owed);font-weight:600}
/* today page */
.hello{display:flex;flex-wrap:wrap;gap:6px 16px;align-items:baseline;justify-content:space-between}
.hello h2{font-family:var(--display);font-size:22px;margin:0;color:var(--brand)}
.stepn{display:inline-flex;align-items:center;justify-content:center;width:24px;height:24px;border-radius:50%;background:var(--brand);color:#FFFFFF;font-family:var(--body);font-size:13px;font-weight:700;margin-right:10px;vertical-align:2px}
table.todo{min-width:640px}
table.todo td{vertical-align:middle}
.invrow{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.invrow input[type=text]{border:1px solid #CBD3DE;border-radius:7px;padding:7px 9px;min-height:36px;width:150px}
.tab.sec2{font-weight:500;font-size:13px}
.tab.sec2.first{margin-left:auto}
.newsup{border:1px dashed var(--brand-line);background:var(--brand-soft)}
/* rules */
.rulelist{display:flex;flex-direction:column}
.rule{display:flex;justify-content:space-between;align-items:center;gap:16px;padding:12px 0;border-bottom:1px solid var(--line);cursor:pointer}
.rule:last-child{border-bottom:0}
.rule b{display:block;font-weight:600}
.rule small{color:var(--muted)}
.switch{appearance:none;-webkit-appearance:none;width:44px;height:24px;border-radius:999px;background:#CBD3DE;position:relative;flex:none;cursor:pointer;margin:0}
.switch::after{content:"";position:absolute;top:3px;left:3px;width:18px;height:18px;border-radius:50%;background:#FFFFFF;box-shadow:0 1px 2px rgba(0,0,0,.2)}
.switch:checked{background:var(--brand)}
.switch:checked::after{left:23px}
.always{columns:2 260px;margin:0;padding-left:18px;font-size:13px}
@media (prefers-reduced-motion: no-preference){.item,.seg button,.role,.svc,.fbtn{transition:border-color .15s,box-shadow .15s,background .15s}.switch::after{transition:left .15s}}

<script>
(function(){
const KEY="romford-bookings-pc-v1";
const RULES=[
  ["ownOnly","See only their own bookings","Off: Sales can open every submitted booking.",true],
  ["enterDmc","Enter the DMC and net rate","Shows the “I know the DMC and the net rate” tick on tour and hotel bookings.",true],
  ["flightNet","Enter portal, PNR and net fare on portal flights","For flights the staff book themselves on Akbar, Riya, TBO etc.",true],
  ["seeSupplier","See the supplier / DMC name","Read-only, on every booking they can open.",false],
  ["seeCost","See the supplier cost (net rate)","Read-only, on every booking they can open.",false],
  ["seeMarkup","See the markup","Read-only, on every booking they can open.",false],
  ["editAfter","Edit client and trip details after submitting","Off: details lock once the booking is submitted.",true],
  ["editPriceAfter","Change the price after submitting","Off: only Accounts can change the price once submitted.",false],
  ["seeHistory","See the change history of their bookings","Who changed what, and when.",false],
  ["canExport","Export their booking list to Excel or PDF","Only the columns Sales can see are exported.",true]
];
const defaultRules=()=>Object.fromEntries(RULES.map(r=>[r[0],r[3]]));
const ROLES={sales:{label:"Sales",who:"Arjun"},res:{label:"Reservations",who:"Reservation Head"},ops:{label:"Operations",who:"Salahu"},accounts:{label:"Accounts",who:"Accountant"},admin:{label:"Admin",who:"Shahinsha"}};
const SERVICES={
  tour:{label:"Tour package",hint:"Through a DMC or self-made",title:"Package price"},
  flight:{label:"Flight",hint:"Portal fare or group fare",title:"Ticket price to client"},
  hotel:{label:"Hotel",hint:"Stay only",title:"Hotel price to client"},
  visa:{label:"Visa",hint:"Visa application",title:"Visa price to client"},
  other:{label:"Other",hint:"Insurance, transfers, forex",title:"Price to client"}
};
const TRIP={
  tour:[["dest","Destination","text"],["start","Travel from","date"],["end","Travel to","date"],["pax","No. of people","number"]],
  flight:[["tripType","Trip type","select",["One way","Return","Multi-city"]],["from","From","text"],["to","To","text"],["depart","Departure date","date"],["ret","Return date","date"],["airline","Airline","text"],["pax","No. of passengers","number"],["paxNames","Passenger names (as on passport)","text","wide"]],
  hotel:[["hotel","Hotel name","text"],["city","City","text"],["checkin","Check-in","date"],["checkout","Check-out","date"],["rooms","Rooms","number"],["pax","Guests","number"]],
  visa:[["country","Country","text"],["visaType","Visa type","text"],["pax","No. of applicants","number"],["appt","Appointment date","date"]],
  other:[["desc","What is it","text","wide"],["start","Date","date"],["pax","No. of people","number"]]
};
const REQ={tour:{block:["dest","start","end","pax"],soft:[]},flight:{block:["from","to","depart","pax"],soft:["ret","paxNames"]},hotel:{block:["hotel","city","checkin","checkout"],soft:["rooms"]},visa:{block:["country","visaType","pax"],soft:["appt"]},other:{block:["desc"],soft:[]}};
const SINGLE={
  dmc:{sup:"DMC",types:["DMC"],ref:"DMC confirmation no.",net:"Net price (B2B)"},
  portal:{sup:"Booking portal",types:["Flight portal"],ref:"PNR",net:"Net fare (B2B)"},
  group:{sup:"Group fare from",types:["Airline / group fare","Flight portal"],ref:"Group PNR",net:"Group net fare (B2B)"},
  hotel:{sup:"Hotel / supplier",types:["Hotel / online","DMC","Other"],ref:"Confirmation no.",net:"Net cost (B2B)"}
};
const CATS=["Flights","Hotels / Airbnb","Car rental","Trains / ferries / transfers","Sightseeing & tickets","Guide / driver","Visa fees","Travel insurance","SIM / eSIM","Card / forex / bank charges","Other"];
const SUPTYPES=["DMC","Flight portal","Airline / group fare","Hotel / online","Car rental","Visa","Insurance","Other"];
const PAYBY=["Bank transfer","Portal wallet","Card / online"];
const MODES=["UPI","Bank transfer","Cash","Card / Razorpay"];
const BANKF=[["accName","Account name"],["bank","Bank"],["accNo","Account no. / IBAN"],["code","IFSC / SWIFT"]];
const ISSUERS=["Booking staff","Reservation Head","In-charge (Reservation Head not available)"];

function P(o){return Object.assign({st:"open"},o||{})}
function seed(){return {opsSeeSell:false,rules:defaultRules(),suppliers:[],files:[],log:[]};}
function load(){try{const v=localStorage.getItem(KEY);return v?JSON.parse(v):null}catch(e){return null}}
function save(){try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){alert("This browser could not save your records. Download a backup before closing this page.");throw e;}}
let S=load()||seed();
S.rules=Object.assign(defaultRules(),S.rules||{});
let role="admin",tab="today",sel=null,selSup=null,newMode=false,bankEdit=null,listFilter="all",submitErr=null,open=false,q="",profitSvc="all";
let moreCols=false,moreStats=false,moreProfit=false,logAll=false,cbType="all",cbMonth="all",openSecs={},draftView=false;
/* where you stopped: per role + tab, saved in this browser */
const NAVKEY=KEY+"-nav";
let V={},navFrom=null,lastTab={};
function vk(){return role+":"+tab}
function stash(){const prev=V[vk()]||{};V[vk()]={open,sel,from:navFrom,scroll:window.scrollY,listScroll:open?(prev.listScroll||0):window.scrollY};lastTab[role]=tab}
function unstash(){const v=V[vk()]||{};open=!!v.open;if(v.sel)sel=v.sel;navFrom=v.from||null;newMode=false;bankEdit=null;submitErr=null;return v.scroll||0}
function persistNav(){const cv=V[vk()]=V[vk()]||{};if(!newMode){cv.open=open;cv.sel=sel;cv.from=navFrom}lastTab[role]=tab;try{localStorage.setItem(NAVKEY,JSON.stringify({role,tab,V,lastTab,listFilter,q,profitSvc,cbType,cbMonth,moreCols,moreStats,moreProfit,openSecs,selSup}))}catch(e){}}
function restoreNav(){try{const n=JSON.parse(localStorage.getItem(NAVKEY)||"null");if(!n)return 0;role=ROLES[n.role]?n.role:"sales";tab=n.tab||"bookings";V=n.V||{};lastTab=n.lastTab||{};listFilter=n.listFilter||"all";q=n.q||"";profitSvc=n.profitSvc||"all";cbType=n.cbType||"all";cbMonth=n.cbMonth||"all";moreCols=!!n.moreCols;moreStats=!!n.moreStats;moreProfit=!!n.moreProfit;openSecs=n.openSecs||{};selSup=n.selSup||null;return unstash()}catch(e){return 0}}
function go(y){requestAnimationFrame(()=>window.scrollTo(0,y||0))}
let scT=null;window.addEventListener("scroll",()=>{clearTimeout(scT);scT=setTimeout(()=>{if(!newMode){stash();persistNav()}},250)},{passive:true});
const DEFAULT_OPEN={sales:["missing","trip"],res:["missing","ticket"],ops:["cost","pay-open"],accounts:["acct","pay-appr"],admin:["acct","pay-appr"]};
function isOpenSec(id,force){const o=openSecs[role]||{};if(id in o)return o[id];if(force)return true;if(draftView&&["trip","pay","knows"].includes(id))return true;return(DEFAULT_OPEN[role]||[]).includes(id)}
function accOpen(id,title,sub,cls,force){return`<details class="sec acc${cls?" "+cls:""}" data-sec="${id}" ${isOpenSec(id,force)?"open":""}><summary><span class="at">${title}${cls&&cls.indexOf("conf")>-1?confTag:""}</span><span class="as">${sub||""}</span><span class="more" aria-hidden="true"></span></summary><div class="ab">`}
const accClose="</div></details>";
function pgSec(id,title,sub,body,dflt){return`<details class="pgsec" data-sec="${id}" ${isOpenSec(id,dflt)?"open":""}><summary><span class="ptitle">${title}</span><span class="as">${sub||""}</span><span class="more" aria-hidden="true"></span></summary><div class="pb">${body}</div></details>`}
let sumClick=0;document.addEventListener("click",e=>{if(e.target.closest&&e.target.closest("summary"))sumClick=Date.now()},true);
document.addEventListener("toggle",e=>{const d=e.target;if(d&&d.matches&&d.matches("details[data-sec]")&&Date.now()-sumClick<1500){(openSecs[role]=openSecs[role]||{})[d.dataset.sec]=d.open;persistNav()}},true);
const DL={async save({filename,data}){const u=URL.createObjectURL(data);const a=document.createElement("a");a.href=u;a.download=filename;document.body.append(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(u),10000);return{status:"saved"}}};
function syncExport(){document.querySelectorAll("[data-act=export]").forEach(b=>{b.disabled=false;b.title="Download this report"})}
const confTag='<span class="conftag" aria-label="Confidential">CONFIDENTIAL</span>';
function band(pct){if(pct==null||!isFinite(pct))return'<span class="muted">—</span>';const t=pct<0.08?"bad":(pct<0.15?"warn":"ok");return chip((pct*100).toFixed(1)+"%",t)}
function dot(svc){return`<span class="dot ${svc}" aria-hidden="true"></span>`}
function expBtns(kind){if(role==="sales"&&!R().canExport)return"";return`<div class="exp"><button class="btn ghost small" data-act="export" data-kind="${kind}" data-fmt="xlsx" ${DL?"":"disabled"}>Export Excel</button><button class="btn ghost small" data-act="export" data-kind="${kind}" data-fmt="pdf" ${DL?"":"disabled"}>Export PDF</button></div>`}
function legendHtml(){
  return`<details class="legend"><summary>Colour guide</summary><div class="lg">
    <div><h4>Status</h4><ul><li>${chip("Done","ok")}</li><li>${chip("Approved","accent")}</li><li>${chip("Waiting","warn")}</li><li>${chip("Needs attention","bad")}</li><li>${chip("Draft","plain")}</li></ul></div>
    <div><h4>Money</h4><ul><li><b class="okt">Green</b> received from the client</li><li><b class="warnt">Amber</b> still to collect from the client</li><li><b class="owed">Orange</b> still owed to suppliers</li>${isAcc()?`<li><span class="sw"></span><b style="color:var(--conf)">Violet</b> confidential: cost, markup, supplier</li>`:""}</ul></div>
    ${isAcc()?`<div><h4>Markup</h4><ul><li>${chip("15% and above","ok")} good</li><li>${chip("8% to 15%","warn")} normal</li><li>${chip("Below 8%","bad")} low, check the price</li></ul></div>`:""}
    <div><h4>Service</h4><ul>${Object.entries(SERVICES).map(([k,s])=>`<li>${dot(k)}${s.label}</li>`).join("")}</ul></div>
  </div></details>`;
}

const $=s=>document.querySelector(s);
const esc=v=>String(v==null?"":v).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const inr=n=>(n==null||n===""||isNaN(n))?"—":"₹"+Math.round(+n).toLocaleString("en-IN");
const fdate=s=>{if(!s)return"—";const d=new Date(String(s).length<=10?s+"T00:00:00":s);return isNaN(d)?s:d.toLocaleDateString("en-IN",{day:"numeric",month:"short",year:"numeric"})};
const ftime=s=>{const d=new Date(s);return isNaN(d)?s:d.toLocaleString("en-IN",{day:"numeric",month:"short",hour:"2-digit",minute:"2-digit"})};
const chip=(t,tone)=>`<span class="chip ${tone}">${esc(t)}</span>`;
const today=()=>{const d=new Date();return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0")};
const uid=p=>p+Date.now().toString(36)+Math.random().toString(36).slice(2,5);
const who=()=>ROLES[role].who;
const supById=id=>S.suppliers.find(s=>s.id===id)||null;
const supName=id=>{const s=supById(id);return s?s.name:"—"};
const sum=(a,fn)=>a.reduce((t,x)=>t+(+fn(x)||0),0);
const isEmpty=v=>v==null||v===""||v===0;
function log(tid,tl,field,from,to){S.log.push({t:new Date().toISOString(),who:who(),role:ROLES[role].label,tid,tl,field,from,to})}
let toastT=null;
function toast(msg){const t=$("#toast");t.textContent=msg;t.hidden=false;clearTimeout(toastT);toastT=setTimeout(()=>{t.hidden=true},3200)}

/* ---------- permissions ---------- */
const isAcc=()=>role==="accounts"||role==="admin";
const isFlight=f=>f.service==="flight";
const isGroup=f=>isFlight(f)&&f.fareType==="group";
const R=()=>S.rules;
const can={
  editTrip:f=>isAcc()||(role==="sales"&&(!f.submitted||R().editAfter))||(role==="res"&&isFlight(f)),
  editPrice:f=>isAcc()||(isGroup(f)?role==="res":((role==="sales"&&(!f.submitted||R().editPriceAfter))||(role==="res"&&isFlight(f)))),
  addReceipt:f=>isAcc()||(isGroup(f)?role==="res":(role==="sales"||(role==="res"&&isFlight(f)))),
  seeReceipts:()=>role!=="ops",
  seeSell:()=>role!=="ops"||S.opsSeeSell,
  seeCost:f=>role==="ops"||isAcc()||(role==="res"&&isFlight(f))||(role==="sales"&&isFlight(f)&&!isGroup(f)&&R().flightNet),
  editCostBase:f=>isAcc()||role==="ops"||(role==="res"&&isFlight(f))||(role==="sales"&&isFlight(f)&&!isGroup(f)&&R().flightNet),
  editTicket:f=>isAcc()||role==="res"||(role==="sales"&&!isGroup(f)),

};

/* ---------- model helpers ---------- */
function singleCfg(f){if(f.service==="tour")return SINGLE.dmc;if(isFlight(f))return f.fareType==="group"?SINGLE.group:SINGLE.portal;return SINGLE.hotel}
function summary(f){
  switch(f.service){
    case"flight":return[(f.from||"?")+" → "+(f.to||"?"),f.fareType==="group"?"Group fare":"Portal fare",f.pax?f.pax+" pax":""].filter(Boolean).join(" · ");
    case"hotel":return[f.hotel,f.city].filter(Boolean).join(", ")||"Hotel";
    case"visa":return(f.country?f.country+" ":"")+(f.visaType||"visa");
    case"other":return f.desc||"Other service";
    default:return f.dest||"Destination not set";
  }
}
function tripLabel(f,k){const t=TRIP[f.service].find(x=>x[0]===k);return t?t[1]:k}
function missing(f){
  const out=[],grp=isGroup(f);
  if(isEmpty(f.client))out.push({k:"client",label:isFlight(f)?"Lead passenger / group name":"Client name",block:true});
  if(isEmpty(f.mobile))out.push({k:"mobile",label:"Mobile",block:true});
  REQ[f.service].block.forEach(k=>{if(isEmpty(f[k]))out.push({k,label:tripLabel(f,k),block:true})});
  if(!grp&&!(+f.sell>0))out.push({k:"sell",label:SERVICES[f.service].title,block:true});
  if(isEmpty(f.address))out.push({k:"address",label:"Address"});
  REQ[f.service].soft.forEach(k=>{if(k==="ret"&&f.tripType!=="Return")return;if(isEmpty(f[k]))out.push({k,label:tripLabel(f,k)})});
  if(f.service==="tour"&&f.start&&f.end&&f.end<f.start)out.push({k:"end",label:"Travel to is before Travel from",block:true});
  if(!grp&&!f.receipts.length)out.push({k:null,target:"nr-amt",label:"Advance payment"});
  return out;
}
function openReqs(f){return(f.requests||[]).filter(r=>!r.done)}
function missCount(f){return missing(f).length+openReqs(f).length}
function itemsOf(f){
  if(f.costMode==="single"){const s=f.single,cfg=singleCfg(f);return[{id:"s",sup:s.sup,amount:(s.pending||!(+s.net))?null:+s.net,label:cfg.sup+(s.ref?" · "+s.ref:"")}]}
  return f.lines.map(l=>({id:l.id,sup:l.sup,amount:+l.amount||0,label:l.cat+(l.ref?" · "+l.ref:"")}));
}
function itemOf(f,id){return itemsOf(f).find(x=>x.id===id)||null}
function calc(f){
  const recV=sum(f.receipts.filter(r=>r.verified),r=>r.amount),recU=sum(f.receipts.filter(r=>!r.verified),r=>r.amount);
  const items=itemsOf(f);
  const pending=f.costMode==="single"?items[0].amount==null:!f.lines.length;
  const cost=pending?null:sum(items,x=>x.amount);
  const paid=sum(f.schedule.filter(x=>x.pay.st==="paid"),x=>x.amount);
  const toPay=sum(f.schedule.filter(x=>x.pay.st==="approved"),x=>x.amount);
  const toApprove=f.schedule.filter(x=>x.pay.st==="open").length;
  const unsched=sum(items,it=>Math.max(0,(it.amount||0)-sum(f.schedule.filter(x=>x.item===it.id),x=>x.amount)));
  const overdue=f.schedule.filter(x=>x.pay.st!=="paid"&&x.due&&x.due<today()).length;
  const sell=+f.sell||0;
  return{recV,recU,pending,cost,paid,toPay,toApprove,unsched,overdue,sell,supDue:cost==null?null:cost-paid,margin:cost==null?null:sell-cost,balance:sell-recV};
}
function status(f,c){
  if(!f.submitted)return["Draft","plain",-1];
  if(!f.receipts.length)return["No advance yet","bad",0];
  if(c.recV===0)return["Check payment","warn",0];
  if(c.pending){
    if(!can.seeCost(f))return["Confirmed","accent",1];
    return[(f.costMode==="single"&&f.single.pending)?"Proceeding · net price pending":"Awaiting supplier cost","warn",1];
  }
  if(!f.invoiceNo)return["Invoice needed","accent",2];
  if(c.balance>0||c.supDue>0)return["Balance due","accent",3];
  return["Closed","ok",4];
}

function supNames(f){const n=[...new Set(itemsOf(f).map(i=>supName(i.sup)).filter(x=>x!=="—"))];return n.length?(n.length>2?n.slice(0,2).join(", ")+" +"+(n.length-2):n.join(", ")):(f.single.supText||"")}

async function doExport(kind,fmt){

/* ---------- receipts & payments (cash book) ---------- */
function cashRows(){
  const out=[];
  S.files.filter(f=>f.submitted).forEach(f=>{
    f.receipts.forEach((r,i)=>out.push({date:r.date,dir:"in",f,i,party:f.client,item:"Client payment",amount:+r.amount||0,mode:r.mode,ref:r.ref,by:r.by,ok:!!r.verified}));
    f.schedule.forEach(x=>{if(x.pay.st!=="paid")return;const it=itemOf(f,x.item),sp=it?supById(it.sup):null;out.push({date:x.pay.paidAt,dir:"out",f,party:it?supName(it.sup):"Supplier",item:it?it.label:"",amount:+x.amount||0,mode:sp?sp.payBy:"",ref:x.pay.ref,by:x.pay.payBy,ok:true})});
  });
  return out.sort((a,b)=>String(b.date).localeCompare(String(a.date)));
}
function cashFiltered(){
  let r=cashRows();
  if(cbType==="in")r=r.filter(x=>x.dir==="in");else if(cbType==="out")r=r.filter(x=>x.dir==="out");else if(cbType==="check")r=r.filter(x=>x.dir==="in"&&!x.ok);
  if(cbMonth!=="all")r=r.filter(x=>String(x.date).slice(0,7)===cbMonth);

}

/* ---------- save / dirty ---------- */
const curVal=el=>el.type==="checkbox"?(el.checked?"1":"0"):el.value;
function dirtyEls(){return[...document.querySelectorAll("[data-p]")].filter(el=>curVal(el)!==(el.dataset.o||"").replace(/^true$/,"1").replace(/^false$/,"0"))}
function updateBar(){
  const n=dirtyEls().length,bar=$("#savebar");
  bar.hidden=!n;bar.classList.remove("flash");
  if(n)$("#sbmsg").textContent=`You have unsaved changes (${n})`;
}
function resolve(p){
  const a=p.split(".");
  if(a[0]==="set")return{obj:S,key:a[1],tid:"rules",tl:"Access rules"};
  if(a[0]==="rule")return{obj:S.rules,key:a[1],tid:"rules",tl:"Access rules"};
  if(a[0]==="sup"){const s=supById(a[1]);return s&&{obj:s,key:a[2],tid:s.id,tl:s.name||"New supplier"}}
  const f=cur();if(!f)return null;const b={tid:f.id,tl:f.id,f};
  if(a[0]==="f")return Object.assign(b,{obj:f,key:a[1]});
  if(a[0]==="s")return Object.assign(b,{obj:f.single,key:a[1]});
  if(a[0]==="t")return Object.assign(b,{obj:f.ticket,key:a[1]});
  if(a[0]==="l"){const l=f.lines.find(x=>x.id===a[1]);return l&&Object.assign(b,{obj:l,key:a[2]})}
  if(a[0]==="sch"){const x=f.schedule.find(y=>y.id===a[1]);return x&&Object.assign(b,{obj:x,key:a[2]})}
  if(a[0]==="r"){const r=f.receipts[+a[1]];return r&&Object.assign(b,{obj:r,key:a[2]})}
  return null;
}
function fmtV(v,t){
  if(t.type==="checkbox")return v?"Yes":"No";
  if(t.dataset.money!=null)return inr(v);
  if(t.dataset.sup!=null)return v?supName(v):"—";
  if(t.type==="date")return fdate(v);
  return(v==null||v==="")?"—":String(v);
}
function commit(){
  const els=dirtyEls();let n=0;const touched=new Set();
  els.forEach(el=>{
    const p=el.dataset.p,r=resolve(p);if(!r)return;
    if(p==="s.supName"){
      const v=el.value.trim(),m=S.suppliers.find(s=>s.name.toLowerCase()===v.toLowerCase()),s=r.f.single;
      const old=s.sup?supName(s.sup):(s.supText||"");
      s.sup=m?m.id:"";s.supText=m?"":v;log(r.tid,r.tl,el.dataset.lab,old||"—",v||"—");n++;touched.add(r.f);return;
    }
    const v=el.type==="checkbox"?el.checked:(el.dataset.num!=null?(el.value===""?null:+el.value):el.value);
    const old=r.obj[r.key];
    r.obj[r.key]=v;n++;if(r.f)touched.add(r.f);
    log(r.tid,p.startsWith("sup.")&&r.key==="name"?(v||"New supplier"):r.tl,el.dataset.lab||r.key,fmtV(old,el),fmtV(v,el));
    if(p==="t.status"&&v==="Issued"&&r.f&&!r.f.ticket.date)r.f.ticket.date=today();
  });
  touched.forEach(f=>{if(role==="sales"&&f.salesKnows&&f.service==="tour")f.costMode="single"});
  if(n)save();
  return n;
}
function onEdit(e){

  if(t.id==="x-s-pending"){const n=document.getElementById(idOf("s.net"));if(n){n.disabled=t.checked;if(t.checked)n.value=""}}

}

    case"svc":{
      const svc=b.dataset.s,year=new Date().getFullYear(),prefix="RH-"+year+"-",n=Math.max(0,...S.files.filter(x=>x.id.startsWith(prefix)).map(x=>+x.id.split("-")[2]||0))+1,id=prefix+String(n).padStart(4,"0");
      const f={id,owner:role==="sales"?"Arjun":"Arjun",createdBy:who(),submitted:false,service:svc,client:"",mobile:"",address:"",pax:1,sell:0,receipts:[],salesKnows:false,requests:[],
        costMode:(svc==="visa"||svc==="other")?"lines":"single",single:{sup:"",supText:"",net:null,ref:"",pending:false},lines:[],terms:"",schedule:[],invoiceNo:"",vyapar:false};
      if(svc==="flight"){f.tripType="Return";f.fareType=role==="res"?"group":"portal";f.ticket={status:"Not issued",issuedBy:role==="res"?"Reservation Head":"Booking staff",nos:"",date:""}}
      S.files.unshift(f);log(id,id,"Draft started",undefined,SERVICES[svc].label);
      sel=id;newMode=false;open=true;listFilter="all";save();renderAll();go(0);const n2=$("#x-f-client");if(n2)n2.focus();return;}
    case"pickSup":if(b.dataset.goto&&tab!==b.dataset.goto){stash();tab=b.dataset.goto;unstash();go(0)}selSup=b.dataset.id;bankEdit=null;renderAll();if(window.matchMedia("(max-width:880px)").matches){const d=$("#view .panel");if(d)d.scrollIntoView({behavior:"smooth",block:"start"})}return;
    case"addSup":{const s={id:uid("s-"),name:"",type:"DMC",payBy:"Bank transfer",contact:"",phone:"",email:"",country:"",accName:"",bank:"",accNo:"",code:"",notes:"",pendingBank:null};
      S.suppliers.push(s);selSup=s.id;bankEdit=null;log(s.id,"New supplier","Supplier added",undefined,"");save();renderAll();const n=$("#"+idOf("sup."+s.id+".name"));if(n)n.focus();return;}
    case"bankEdit":bankEdit=selSup;renderAll();{const n=$("#bk-accName");if(n)n.focus()}return;
    case"bankCancel":bankEdit=null;renderAll();return;
    case"bankSend":{const s=supById(selSup);if(!s)return;const data={};BANKF.forEach(([k])=>data[k]=($("#bk-"+k).value||"").trim());
      if(BANKF.every(([k])=>(s[k]||"")===data[k])){bankEdit=null;renderAll();return}
      s.pendingBank={data,by:who(),role,at:today()};bankEdit=null;
      log(s.id,s.name,"Bank change requested",undefined,"Sent to "+approverText(s.pendingBank)+" for approval");save();renderAll();toast("Sent to "+approverText(s.pendingBank)+" for approval.");return;}
    case"bankApprove":case"bankReject":case"bankWithdraw":{const s=supById(selSup);if(!s||!s.pendingBank)return;const pb=s.pendingBank;
      if(act==="bankApprove"){BANKF.forEach(([k,l])=>{if((s[k]||"")!==(pb.data[k]||"")){log(s.id,s.name,"Bank: "+l,s[k]||"—",pb.data[k]||"—");s[k]=pb.data[k]}});log(s.id,s.name,"Bank change approved",undefined,"Requested by "+pb.by)}
      else log(s.id,s.name,act==="bankReject"?"Bank change rejected":"Bank change withdrawn",undefined,"Requested by "+pb.by);
      s.pendingBank=null;save();renderAll();return;}
    case"approve":case"unapprove":case"pay":case"unpay":{
      const o=getInst(b);if(!o)return;const{f,x,it}=o,p=x.pay,lbl=supName(it.sup)+" · "+inr(x.amount);
      if(act==="pay"){const inp=document.getElementById(`pr-${f.id}-${x.id}`),ref=inp?inp.value.trim():"";
        if(!ref){if(inp){inp.placeholder="Enter the payment ref first";inp.focus()}return}
        x.pay=Object.assign({},p,{st:"paid",payBy:who(),ref,paidAt:today()});log(f.id,f.id,"Supplier paid",undefined,lbl+" · "+ref)}
      if(act==="approve"){x.pay={st:"approved",by:who(),at:today()};log(f.id,f.id,"Supplier payment approved",undefined,lbl+" · pay by "+fdate(x.due))}
      if(act==="unapprove"){x.pay={st:"open"};log(f.id,f.id,"Supplier payment approval cancelled",undefined,lbl)}
      if(act==="unpay"){x.pay={st:"approved",by:p.by,at:p.at};log(f.id,f.id,"Supplier payment marked unpaid",undefined,lbl)}
      save();renderAll();return;}
  }
  const f=cur();if(!f)return;
  if(act==="submit"){
    const blk=missing(f).filter(m=>m.block);
    if(blk.length){submitErr=blk.map(m=>m.label);renderAll();const d=$(".draft");if(d)d.scrollIntoView({behavior:"smooth",block:"center"});return}
    f.submitted=true;submitErr=null;log(f.id,f.id,"Booking submitted",undefined,SERVICES[f.service].label);save();renderAll();
    toast("Submitted. Operations and Accounts can now see this booking.");return}
  if(act==="reqDone"){const r=(f.requests||[]).find(x=>x.id===b.dataset.id);if(!r)return;r.done=true;r.doneBy=who();r.doneAt=today();log(f.id,f.id,"Information request done",undefined,r.text);save();renderAll();toast("Marked done. "+r.by+" will see it.");return}
  if(act==="askSales"){const t=($("#rq-text").value||"").trim();if(!t){$("#rq-text").focus();return}
    f.requests=f.requests||[];f.requests.push({id:uid("q"),text:t,by:who(),role:ROLES[role].label,at:today(),done:false});log(f.id,f.id,"Asked Sales for information",undefined,t);save();renderAll();toast("Sent to Sales.");return}
  if(act==="fare"){const v=b.dataset.v;if(f.fareType===v)return;log(f.id,f.id,"Fare type",f.fareType==="group"?"Group fare":"Portal fare",v==="group"?"Group fare":"Portal fare");f.fareType=v;
    if(v==="group"&&f.ticket.issuedBy==="Booking staff")f.ticket.issuedBy="Reservation Head";if(v==="portal"&&f.ticket.issuedBy!=="Booking staff"&&f.ticket.status!=="Issued")f.ticket.issuedBy="Booking staff";
    if(!f.single.sup||!singleCfg(f).types.includes((supById(f.single.sup)||{}).type))f.single.sup="";save();renderAll();return}
  if(act==="mode"){if(f.costMode===b.dataset.m)return;log(f.id,f.id,"Supply method",f.costMode==="single"?"Through DMC":"Self DMC",b.dataset.m==="single"?"Through DMC":"Self DMC");f.costMode=b.dataset.m;f.schedule=[];save();renderAll();return}
  if(act==="addLine"){const def={visa:"Visa fees",hotel:"Hotels / Airbnb"}[f.service]||"Flights";const l={id:uid("L"),cat:def,sup:"",ref:"",amount:0};f.lines.push(l);log(f.id,f.id,"Cost line added",undefined,def);save();renderAll();const n=$("#x-l-"+l.id+"-sup");if(n)n.focus();return}
  if(act==="delLine"){const i=f.lines.findIndex(l=>l.id===b.dataset.id);if(i<0||itemLocked(f,b.dataset.id))return;const l=f.lines[i];f.lines.splice(i,1);f.schedule=f.schedule.filter(x=>x.item!==l.id);log(f.id,f.id,"Cost line removed",undefined,l.cat+" · "+inr(l.amount));save();renderAll();return}
  if(act==="addSch"){const itemId=$("#ns-item").value,it=itemOf(f,itemId);if(!it)return;
    const due=$("#ns-due").value;if(!due){$("#ns-due").focus();return}
    let amt=+$("#ns-amt").value;if(!amt)amt=Math.max(0,(it.amount||0)-sum(f.schedule.filter(x=>x.item===itemId),x=>x.amount));
    if(!amt){$("#ns-amt").placeholder="Already fully scheduled";$("#ns-amt").focus();return}
    f.schedule.push({id:uid("i"),item:itemId,amount:amt,due,pay:P()});log(f.id,f.id,"Payment date added",undefined,supName(it.sup)+" · "+inr(amt)+" · pay by "+fdate(due));save();renderAll();return}
  if(act==="delSch"){const x=f.schedule.find(y=>y.id===b.dataset.id);if(!x||x.pay.st!=="open")return;const it=itemOf(f,x.item);f.schedule=f.schedule.filter(y=>y!==x);log(f.id,f.id,"Payment date removed",undefined,(it?supName(it.sup):"")+" · "+inr(x.amount));save();renderAll();return}
  if(act==="addReceipt"){const amt=+$("#nr-amt").value;if(!amt){$("#nr-amt").placeholder="Enter the amount";$("#nr-amt").focus();return}
    const r={date:$("#nr-date").value||today(),amount:amt,mode:$("#nr-mode").value,ref:$("#nr-ref").value.trim(),verified:false,by:who()};f.receipts.push(r);
    log(f.id,f.id,"Client payment added",undefined,inr(amt)+" · "+r.mode+(r.ref?" · "+r.ref:""));save();renderAll();toast("Payment added. Accounts will verify it.");return}
});

$("#backup-local").onclick=async()=>{
  if(dirtyEls().length){alert("Save or discard your current edits first.");return;}
  const data=new Blob([JSON.stringify({format:"romford-bookings-pc-v1",records:S},null,2)],{type:"application/json"});
  await DL.save({filename:"Romford_Bookings_Backup_"+new Date().toISOString().slice(0,10)+".json",data});
  toast("Backup downloaded.");
};
$("#restore-local").onclick=()=>{
  if(dirtyEls().length){alert("Save or discard your current edits first.");return;}
  $("#backup-file").click();
};
$("#backup-file").onchange=async e=>{
  const file=e.target.files[0];
  e.target.value="";
  if(!file)return;
  try{
    const copy=JSON.parse(await file.text()), records=copy.records;
    if(copy.format!=="romford-bookings-pc-v1"||!records||!["files","suppliers","log"].every(k=>Array.isArray(records[k])))throw Error("Choose a backup made by Romford Bookings PC.");
    if(!confirm("Replace the current records with this backup?"))return;
    localStorage.setItem(KEY,JSON.stringify(records));
    location.reload();
  }catch(error){alert(error.message);}
};
document.addEventListener("change",e=>{if(e.target.id==="preview-role"){const b=document.querySelector('#roles [data-r="'+e.target.value+'"]');if(b)b.click()}});
